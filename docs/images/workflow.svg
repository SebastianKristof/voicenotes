<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">VoiceNotes end-to-end workflow</title>
  <desc id="desc">Synthetic product walkthrough with captured voice, transcript and summary, and generated content.</desc>
  <rect width="1600" height="900" fill="#0b1020"/>
  <text x="800" y="72" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700" fill="#f8fafc">From spoken idea to reusable content</text>
  <text x="800" y="112" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#94a3b8">Synthetic demonstration · no private recordings or personal notes</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="70" y="170" width="440" height="610" rx="28" fill="#151c31" stroke="#26324f" stroke-width="3"/>
    <text x="110" y="225" font-size="18" font-weight="700" fill="#7dd3fc">1 · CAPTURE</text>
    <text x="110" y="278" font-size="30" font-weight="700" fill="#f8fafc">New voice note</text>
    <rect x="110" y="330" width="360" height="170" rx="20" fill="#0e1528"/>
    <circle cx="290" cy="415" r="52" fill="#fb5d55"/>
    <circle cx="290" cy="415" r="19" fill="#ffffff"/>
    <text x="290" y="545" text-anchor="middle" font-size="18" fill="#cbd5e1">00:42</text>
    <text x="110" y="620" font-size="18" fill="#94a3b8">Microphone or file upload</text>
    <text x="110" y="654" font-size="18" fill="#94a3b8">Audio and video supported</text>
    <rect x="110" y="700" width="360" height="52" rx="14" fill="#26324f"/>
    <text x="290" y="734" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">Transcribe</text>

    <rect x="580" y="170" width="440" height="610" rx="28" fill="#151c31" stroke="#26324f" stroke-width="3"/>
    <text x="620" y="225" font-size="18" font-weight="700" fill="#a78bfa">2 · UNDERSTAND</text>
    <text x="620" y="278" font-size="30" font-weight="700" fill="#f8fafc">Transcript + summary</text>
    <text x="620" y="335" font-size="17" font-weight="700" fill="#94a3b8">TRANSCRIPT</text>
    <text x="620" y="380" font-size="20" fill="#e2e8f0">A useful AI evaluation should test</text>
    <text x="620" y="414" font-size="20" fill="#e2e8f0">behavior across realistic scenarios,</text>
    <text x="620" y="448" font-size="20" fill="#e2e8f0">not just one polished prompt.</text>
    <line x1="620" y1="492" x2="980" y2="492" stroke="#26324f" stroke-width="2"/>
    <text x="620" y="540" font-size="17" font-weight="700" fill="#94a3b8">AI SUMMARY</text>
    <text x="620" y="585" font-size="22" font-weight="700" fill="#f8fafc">Evaluate behavior, not demos</text>
    <text x="620" y="627" font-size="18" fill="#cbd5e1">Use scenario sets and explicit rubrics</text>
    <text x="620" y="657" font-size="18" fill="#cbd5e1">to reveal inconsistent model behavior.</text>
    <rect x="620" y="700" width="164" height="42" rx="12" fill="#283451"/>
    <text x="702" y="727" text-anchor="middle" font-size="16" fill="#c4b5fd">#ai-evaluation</text>

    <rect x="1090" y="170" width="440" height="610" rx="28" fill="#151c31" stroke="#26324f" stroke-width="3"/>
    <text x="1130" y="225" font-size="18" font-weight="700" fill="#86efac">3 · DRAFT</text>
    <text x="1130" y="278" font-size="30" font-weight="700" fill="#f8fafc">Generated content</text>
    <rect x="1130" y="325" width="360" height="330" rx="20" fill="#0e1528"/>
    <text x="1160" y="370" font-size="16" font-weight="700" fill="#86efac">LINKEDIN · MEDIUM</text>
    <text x="1160" y="420" font-size="21" font-weight="700" fill="#f8fafc">A convincing model demo is not</text>
    <text x="1160" y="453" font-size="21" font-weight="700" fill="#f8fafc">the same as a reliable system.</text>
    <text x="1160" y="507" font-size="18" fill="#cbd5e1">Evaluation starts when behavior is</text>
    <text x="1160" y="538" font-size="18" fill="#cbd5e1">tested across realistic scenarios</text>
    <text x="1160" y="569" font-size="18" fill="#cbd5e1">with an explicit rubric.</text>
    <rect x="1130" y="700" width="174" height="52" rx="14" fill="#22c55e"/>
    <text x="1217" y="734" text-anchor="middle" font-size="18" font-weight="700" fill="#052e16">Save draft</text>
    <rect x="1318" y="700" width="172" height="52" rx="14" fill="#26324f"/>
    <text x="1404" y="734" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">Regenerate</text>
  </g>
</svg>
